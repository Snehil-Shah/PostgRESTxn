site_name: PostgRESTxn
site_url: https://snehil-shah.github.io/postgrestxn/
repo_url: https://github.com/Snehil-Shah/PostgRESTxn
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - content.code.copy
    - content.action.edit
    - navigation.expand
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: blue grey
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: blue grey
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - awesome-nav

extra:
  version:
    provider: mike

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
