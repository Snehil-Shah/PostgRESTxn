services:
  postgres:
    image: postgres:17-alpine
    container_name: postgrestxn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgrestxn
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgrestxn:
    build: .
    container_name: postgrestxn-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgrestxn
      ANON_ROLE: web_anon
      DB_SCHEMAS: public
      HTTP_PORT: "4000"
      ADMIN_HTTP_PORT: "9568"
    ports:
      - "4000:4000"
      # - "9568:9568" # Expose when you want to debug

volumes:
  postgres_data:
