name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  packages: write  # for pushing to GHCR

jobs:
  registry:
    name: Container Registries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"  # strip v prefix to get version
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/postgrestxn:${{ steps.version.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/postgrestxn:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/postgrestxn:${{ steps.version.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/postgrestxn:latest

  docs:
    name: Deploy docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }} # NOTE: Using PAT because bot commits don't trigger deployment workflows.

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install Python dependencies
        run: pip install -r docs/requirements.txt

      - name: Configure git for Mike
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Deploy version
        run: |
          mike deploy --push --update-aliases \
            --message "chore(docs): deploy ${GITHUB_REF_NAME}" \
            "${GITHUB_REF_NAME}" stable

  github:
    name: GitHub
    runs-on: ubuntu-latest
    needs: [registry, docs]

    env:
      MIX_ENV: prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Install dependencies
        run: mix deps.get --only prod

      - name: Build release tarball
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: mix release --tar

      - name: Attach tarball to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: _build/prod/postgrestxn-*.tar.gz
          generate_release_notes: true
          body: |
            ## Distributions

            Find the official distributions from:

            - [GitHub Container Registry](https://github.com/Snehil-Shah/PostgRESTxn/pkgs/container/postgrestxn/versions)

              ```bash
              docker pull ghcr.io/snehil-shah/postgrestxn:${{ github.ref_name }}
              ```

            - [Docker Hub](https://hub.docker.com/repository/docker/snehilshah/postgrestxn/tags/${{ github.ref_name }})

              ```bash
              docker pull snehilshah/postgrestxn:${{ github.ref_name }}
              ```

            Find the docs [here](https://snehil-shah.github.io/postgrestxn/${{ github.ref_name }}/).
