name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  packages: write  # for pushing to GHCR

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
      tag: ${{ steps.extract.outputs.tag }}

    steps:
      - id: extract
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"  # strip v prefix to get version
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  registry:
    name: Container Registries
    needs: version
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-mode: max
      sign: false
      build-args: |
        APP_VERSION=${{ needs.version.outputs.version }}
      meta-images: |
        ghcr.io/snehil-shah/postgrestxn
        snehilshah/postgrestxn
      meta-tags: |
        type=ref,event=tag
        type=raw,value=latest
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        - registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

  docs:
    name: Deploy docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }} # NOTE: Using PAT because bot commits don't trigger deployment workflows.

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install Python dependencies
        run: pip install -r docs/requirements.txt

      - name: Configure git for Mike
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Deploy version
        run: |
          mike deploy --push --update-aliases \
            --message "chore(docs): deploy ${GITHUB_REF_NAME}" \
            "${GITHUB_REF_NAME}" stable

  github:
    name: GitHub
    runs-on: ubuntu-latest
    needs: [version, registry, docs]

    env:
      MIX_ENV: prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Install dependencies
        run: mix deps.get --only prod

      - name: Build release tarball
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: mix release --tar

      - name: Attach tarball to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: _build/prod/postgrestxn-*.tar.gz
          generate_release_notes: true
          body: |
            ## Distributions

            Find the official distributions from:

            - [GitHub Container Registry](https://github.com/Snehil-Shah/PostgRESTxn/pkgs/container/postgrestxn/versions)

              ```bash
              docker pull ghcr.io/snehil-shah/postgrestxn:${{ needs.version.outputs.tag }}
              ```

            - [Docker Hub](https://hub.docker.com/repository/docker/snehilshah/postgrestxn/tags/${{ needs.version.outputs.tag }})

              ```bash
              docker pull snehilshah/postgrestxn:${{ needs.version.outputs.tag }}
              ```

            Find the docs [here](https://snehil-shah.github.io/postgrestxn/${{ needs.version.outputs.tag }}/).
